<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>一棵树的四季</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: linear-gradient(#bfe7f8, #dff3ff);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; filter: saturate(1.06) contrast(1.035); }

  /* 顶部极淡的压暗 + 底部字幕 scrim：让文字像字幕而不是展板 */
  body::before {
    content: ""; position: fixed; left: 0; right: 0; inset: 0;
    background:
      linear-gradient(rgba(16, 40, 58, .18), rgba(16, 40, 58, 0) 18%),
      linear-gradient(to top, rgba(12, 22, 14, .46), rgba(12, 22, 14, 0) 30%);
    pointer-events: none; z-index: 1;
  }
  #hud, #tips, #replant { z-index: 2; }

  #hud {
    position: fixed; left: max(4.2vw, 22px); bottom: max(8.5vh, 44px);
    pointer-events: none; color: #f5ecdc;
    text-shadow: 0 2px 26px rgba(10, 28, 20, .65), 0 1px 3px rgba(10, 28, 20, .55);
  }
  #season {
    font-size: clamp(38px, 6.6vmin, 72px);
    font-weight: 300;
    letter-spacing: .14em;
    line-height: 1;
    font-family: "Songti SC", "STSong", "SimSun", serif;
  }
  @keyframes seasonIn {
    from { opacity: 0; transform: translateY(10px) scale(.97); }
    to { opacity: 1; transform: none; }
  }
  #sub {
    margin-top: .55em;
    font-size: clamp(11px, 1.55vmin, 15px);
    letter-spacing: .38em;
    opacity: .78;
    font-weight: 300;
  }
  #year {
    margin-top: .8em;
    font-size: clamp(10px, 1.25vmin, 12px);
    letter-spacing: .28em;
    opacity: .52;
    font-weight: 300;
  }

  #tips {
    position: fixed; left: 50%; bottom: max(3vh, 18px); transform: translateX(-50%);
    font-size: clamp(11px, 1.6vmin, 14px); letter-spacing: .16em;
    color: rgba(255,255,255,.88); text-shadow: 0 1px 12px rgba(18,46,66,.55), 0 1px 3px rgba(18,46,66,.45);
    pointer-events: none; white-space: nowrap; transition: opacity 1s ease;
  }

  #replant {
    position: fixed; right: max(4vw, 20px); bottom: max(3vh, 16px);
    padding: 12px 22px; border-radius: 999px; cursor: pointer;
    font: inherit; font-size: clamp(13px, 1.9vmin, 16px); letter-spacing: .12em;
    color: #2c4a34; background: rgba(255,255,255,.72);
    border: 1px solid rgba(255,255,255,.85);
    box-shadow: 0 8px 26px rgba(40, 80, 60, .16);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform .18s ease, background .18s ease;
  }
  #replant:hover { transform: translateY(-2px); background: #fff; }
  #replant:active { transform: translateY(0) scale(.97); }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 45%, rgba(12,26,20,.28) 100%);
  }

  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #4b7a5e; letter-spacing: .3em; font-size: 15px;
    background: linear-gradient(#bfe7f8, #e6f6ff);
  }

  /* 手机竖屏：文字缩小、按钮挪到底部居中，避免被挤出屏幕 */
  @media (max-width: 560px) {
    #hud { left: 20px; top: auto; bottom: 118px; }
    #season { font-size: 40px; }
    #sub { letter-spacing: .26em; }
    #tips {
      left: 0; right: 0; bottom: 84px; transform: none; text-align: center;
      font-size: 11px; letter-spacing: .1em; white-space: normal; padding: 0 20px;
    }
    #replant {
      left: 50%; right: auto; transform: translateX(-50%);
      bottom: max(3vh, 26px); padding: 10px 26px; font-size: 14px;
    }
    #replant:hover { transform: translateX(-50%); }
    #replant:active { transform: translateX(-50%) scale(.97); }
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="season">春</div>
    <div id="sub">万物发芽</div>
    <div id="year">第 1 年</div>
  </div>

  <div id="tips">拖动可以环顾四周 · 滚轮或双指可以靠近</div>
  <button id="replant">再种一棵</button>
  <div id="vignette"></div>
  <div id="loading">正在种树…</div>

  <script src="./app.js"></script>
</body>
</html>
